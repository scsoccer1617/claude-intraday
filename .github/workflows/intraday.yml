name: Claude intraday pot (paper)

# GitHub's every-5-minute schedule is unreliable (runs get dropped or delayed for hours),
# so instead ONE job starts in the morning and loops itself every 5 minutes until 3:16 PM ET.
# Extra start times later in the day are backups in case GitHub drops the morning trigger;
# if the loop is already running, the backup just waits and then exits.
# Times are UTC, set for EASTERN STANDARD TIME (Nov-Mar). When clocks spring forward
# (Mar 8, 2027), subtract 1 from each hour (14->13, 15->14, ...).

on:
  schedule:
    - cron: "35 14 * * 1-5"   # 9:35 AM ET
    - cron: "35 15 * * 1-5"   # 10:35 backup
    - cron: "35 16 * * 1-5"   # 11:35 backup
    - cron: "35 17 * * 1-5"   # 12:35 backup
    - cron: "35 18 * * 1-5"   # 1:35 backup
  workflow_dispatch: {}

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Loop every 5 minutes until 3:16 PM ET
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          t=$(TZ=America/New_York date +%H%M)
          if [ "$t" -lt 0930 ] || [ "$t" -gt 1515 ]; then echo "Outside trading window ($t ET), exiting."; exit 0; fi
          while :; do
            t=$(TZ=America/New_York date +%H%M)
            if [ "$t" -gt 1516 ]; then echo "Done for the day ($t ET)."; break; fi
            python3 intraday.py || echo "check failed, will retry in 5 min"
            sleep $(( 300 - $(date +%s) % 300 + 5 ))
          done
